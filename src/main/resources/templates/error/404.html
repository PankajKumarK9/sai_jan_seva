<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - Sai Jan Kalyan Seva Sansthan</title>
    <meta name="description" content="The requested page was not found.">
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main>
    <section class="page-hero not-found">
        <div class="container narrow">
            <span class="eyebrow">404</span>
            <h1>Page Not Found</h1>
            <p>The page you are looking for may have moved. You can continue from the homepage or contact us for course information.</p>
            <div class="actions centered">
                <a class="btn btn-primary" href="/">Go Home</a>
                <a class="btn btn-secondary" href="/contact">Contact Us</a>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments :: footer}"></div>
<div th:replace="~{fragments :: floatingActions}"></div>
<script src="/js/site.js"></script>
</body>
</html>
